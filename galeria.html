<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Casa Quinta Melgar</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="150x150" href="img/logo.png">
  <style>
    body{ font-family:'Poppins',sans-serif; margin:0; background:#0d0d0d; color:#fff; text-align:center; }
    h1{ margin:30px 0; font-size:2.5rem; }
    .fotos-grid{ display:grid; grid-template-columns: repeat(auto-fit,minmax(250px,1fr)); gap:15px; max-width:1200px; margin:0 auto; padding:20px }
    .fotos-grid img{ width:100%; height:200px; object-fit:cover; border-radius:12px; cursor:pointer; transition:transform .25s }
    .fotos-grid img:hover{ transform:scale(1.03) }

    /* Lightbox */
    .lightbox{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); align-items:center; justify-content:center; z-index:12000; }
    .lightbox.open{ display:flex }
    .lightbox img{ max-width:90%; max-height:90%; border-radius:12px }
    .close-btn, .prev, .next{ position:absolute; color:#fff; cursor:pointer; user-select:none; font-size:2em; }
    .close-btn{ top:20px; right:30px; }
    .prev{ left:10px; top:50%; transform:translateY(-50%) }
    .next{ right:10px; top:50%; transform:translateY(-50%) }

    .boton-atras {
  position: fixed;
  top: 15px;
  left: 15px;
  background-color: #007bff;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 16px;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
  transition: background-color 0.3s ease;
}

.boton-atras:hover {
  background-color: #0056b3;
}

  </style>
</head>
<button id="btnAtras" class="boton-atras">⬅️ Atrás</button>
<body>
  <h1>Galería Casa Quinta Melgar</h1>
  <div class="fotos-grid" id="galeria">
    <!-- Aquí se agregarán las imágenes -->
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox">
    <span class="close-btn" id="closeLightbox">&times;</span>
    <span class="prev" id="prev">&#10094;</span>
    <img id="lightboxImg" src="" alt="Imagen ampliada">
    <span class="next" id="next">&#10095;</span>
  </div>

  <script>
    // Lista de imágenes (puedes generar esto con tu script)
    const imagenes = [
   "img/fondo.jpeg",
  "img/imagen (10).jpeg",
  "img/imagen (11).jpeg",
  "img/imagen (12).jpeg",
  "img/imagen (13).jpeg",
  "img/imagen (14).jpeg",
  "img/imagen (15).jpeg",
  "img/imagen (16).jpeg",
  "img/imagen (17).jpeg",
  "img/imagen (18).jpeg",
  "img/imagen (19).jpeg",
  "img/imagen (2).jpeg",
  "img/imagen (20).jpeg",
  "img/imagen (21).jpeg",
  "img/imagen (22).jpeg",
  "img/imagen (23).jpeg",
  "img/imagen (24).jpeg",
  "img/imagen (25).jpeg",
  "img/imagen (26).jpeg",
  "img/imagen (27).jpeg",
  "img/imagen (28).jpeg",
  "img/imagen (29).jpeg",
  "img/imagen (3).jpeg",
  "img/imagen (30).jpeg",
  "img/imagen (4).jpeg",
  "img/imagen (5).jpeg",
  "img/imagen (6).jpeg",
  "img/imagen (7).jpeg",
  "img/imagen (8).jpeg",
  "img/imagen (9).jpeg",
  "img/imagen.jpeg"
];

document.getElementById("btnAtras").addEventListener("click", function() {
  window.location.href = "index.html"; // Cambia el nombre del archivo si tu página principal tiene otro nombre
});



    const galeria = document.getElementById('galeria');
    imagenes.forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      galeria.appendChild(img);
    });

    // Lightbox
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const closeLightbox = document.getElementById('closeLightbox');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');

    let idx = 0;
    const fotos = Array.from(galeria.querySelectorAll('img'));

    fotos.forEach((img, i) => {
      img.addEventListener('click', () => {
        idx = i;
        lightboxImg.src = img.src;
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
      });
    });

    closeLightbox.addEventListener('click', () => {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    });

    prevBtn.addEventListener('click', () => {
      idx = (idx === 0) ? fotos.length - 1 : idx - 1;
      lightboxImg.src = fotos[idx].src;
    });
    nextBtn.addEventListener('click', () => {
      idx = (idx === fotos.length - 1) ? 0 : idx + 1;
      lightboxImg.src = fotos[idx].src;
    });

    document.addEventListener('keydown', (e) => {
      if(lightbox.classList.contains('open')){
        if(e.key === 'ArrowLeft') prevBtn.click();
        if(e.key === 'ArrowRight') nextBtn.click();
        if(e.key === 'Escape') closeLightbox.click();
      }
    });
  </script>
</body>
</html>
